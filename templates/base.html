<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PhishTrace{% endblock %}</title>
  <meta name="description" content="PhishTrace investigates a URL with transparent rules, a local knowledge base, and a separate verifier.">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/site.css">
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="/">
      <span class="mark">PT</span>
      <span>
        <strong>PhishTrace</strong>
        <small>Investigation workbench</small>
      </span>
    </a>
    <nav class="nav" aria-label="Primary">
      {% for item in nav %}
      <a href="{{ item.path }}" {% if active == item.key %}aria-current="page"{% endif %}>{{ item.label }}</a>
      {% endfor %}
    </nav>
  </header>
  <main id="content">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div>Mahapara · 26I8005_A · MS (Data Science)</div>
    <div>Local only · no page fetch · no trained model · <a href="/docs">API docs</a></div>
  </footer>
</body>
</html>
